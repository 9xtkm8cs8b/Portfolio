<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Sean Martin</title>
  <meta name="description" content="Sean Martin — Commercial Director">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Abril+Fatface&&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loader -->
  <div class="loader">
    <div class="loader-inner">
      <div class="loader-line"></div>
    </div>
  </div>

  <!-- Noise Overlay -->
  <div class="noise"></div>

  <!-- Custom Cursor -->
  <div class="cursor"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-logo"><a href="index.html">Sean Martin</a></div>
    <ul class="nav-links">
      <li><a href="index.html#work">Work</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Project Page -->
  <main class="project-page">
    <div class="project-hero">
      <div class="project-hero-bleed"></div>
      <div class="project-hero-content">
        <a href="index.html" class="back-link">
          <span>←</span> All Projects
        </a>
        <div class="project-hero-tag reveal"></div>
        <h1 class="project-hero-title reveal reveal-delay-1"></h1>
        <div class="project-meta-row reveal reveal-delay-2">
          <div class="project-meta-item">
            <span class="project-meta-label">Client</span>
            <span class="project-meta-value"></span>
          </div>
          <div class="project-meta-item">
            <span class="project-meta-label">Role</span>
            <span class="project-meta-value"></span>
          </div>
          <div class="project-meta-item">
            <span class="project-meta-label">Year</span>
            <span class="project-meta-value"></span>
          </div>
        </div>
        <p class="project-description reveal reveal-delay-3"></p>
      </div>
    </div>

    <div class="gradient-line" style="margin: 40px 40px 60px;"></div>

    <div class="project-video reveal">
      <div class="video-wrapper">
        <!-- Vimeo embed injected by JS -->
      </div>
    </div>

    <!-- Prev/Next Nav -->
    <nav class="project-nav">
      <a href="#" class="project-nav-link prev">
        <span class="project-nav-label">← Previous</span>
        <span class="project-nav-title"></span>
      </a>
      <a href="#" class="project-nav-link next">
        <span class="project-nav-label">Next →</span>
        <span class="project-nav-title"></span>
      </a>
    </nav>
  </main>

  <!-- Footer -->
  <footer class="footer" id="contact">
    <div class="gradient-line" style="margin-bottom: 60px;"></div>
    <div class="footer-inner">
      <a href="mailto:hello@seanmartin.com" class="footer-cta">
        Let's <span class="gradient-word">talk.</span>
      </a>
      <div class="footer-links">
        <a href="#">Vimeo</a>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2024 Sean Martin. All rights reserved.</span>
      <span>Commercial Director — LA</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
