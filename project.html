<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Sean Martin</title>
  <meta name="description" content="Sean Martin — Commercial Director">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loader -->
  <div class="loader">
    <div class="loader-inner">
      <div class="loader-line"></div>
    </div>
  </div>

  <!-- Noise Overlay -->
  <div class="noise"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-logo"><a href="index.html">Sean Martin</a></div>
    <ul class="nav-links">
      <li><a href="work.html">Work</a></li>
      <li><a href="index.html#about">About</a></li>
    </ul>
  </nav>

  <!-- Project Page -->
  <main class="project-page">

    <!-- Hero: Info + Video -->
    <div class="project-hero">
      <div class="project-hero-content">
        <a href="work.html" class="back-link">
          <span>&larr;</span> All Projects
        </a>
        <div class="project-info-grid">
          <div class="project-info-left">
            <h1 class="project-client reveal"></h1>
            <div class="project-meta-list reveal reveal-delay-1">
              <div class="project-meta-item">
                <span class="project-meta-label">Director</span>
                <span class="project-meta-value"></span>
              </div>
              <div class="project-meta-item">
                <span class="project-meta-label">Category</span>
                <span class="project-meta-value"></span>
              </div>
              <div class="project-meta-item">
                <span class="project-meta-label">Year</span>
                <span class="project-meta-value"></span>
              </div>
            </div>
          </div>
          <div class="project-info-right">
            <h2 class="project-title reveal reveal-delay-1"></h2>
            <p class="project-description reveal reveal-delay-2"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Video -->
    <div class="project-video reveal">
      <div class="video-wrapper">
        <!-- Vimeo embed injected by JS -->
      </div>
    </div>

    <!-- Styleframes / Gallery -->
    <div class="project-gallery" id="projectGallery">
      <!-- Injected by JS -->
    </div>

    <!-- Prev/Next Nav -->
    <nav class="project-nav">
      <a href="#" class="project-nav-link prev">
        <span class="project-nav-label">&larr; Previous</span>
        <span class="project-nav-title"></span>
      </a>
      <a href="#" class="project-nav-link next">
        <span class="project-nav-label">Next &rarr;</span>
        <span class="project-nav-title"></span>
      </a>
    </nav>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="mailto:hello@seanmartin.com" class="footer-cta">
        Let's <span class="gradient-word">talk.</span>
      </a>
      <div class="footer-links">
        <a href="#">Vimeo</a>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2024 Sean Martin. All rights reserved.</span>
      <span>Commercial Director — LA</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
